server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location = / {
        return 302 /siofi;
    }

    # public/_redirects (formato Cloudflare Pages) não é lido pelo nginx — esta
    # regra reproduz aqui o "trailing slash → sem trailing slash" da spec técnica
    # §4 para quem acessar /siofi/ diretamente.
    location = /siofi/ {
        return 301 /siofi;
    }

    location / {
        # $uri.html precisa vir antes de $uri: o build gera "siofi.html" (build.format
        # 'file', trailingSlash 'never' — astro.config.mjs) mas também existe o
        # diretório "siofi/" (por causa de /siofi/obrigado). Se $uri for checado
        # primeiro, o nginx bate no diretório "siofi/" e força um redirect
        # automático de "/siofi" para "/siofi/" antes de chegar em "siofi.html".
        try_files $uri.html $uri $uri/ =404;
    }

    location = /404.html {
        internal;
    }
}
